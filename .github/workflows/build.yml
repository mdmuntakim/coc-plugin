name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: unit tests, APK, signature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build, test and sign
        run: bash build.sh

      - name: Verify the published artefact
        run: |
          set -euo pipefail
          APK=dist/COCPlugin-1.0.0.apk
          test -s "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -q "package: name='plugin.clashofclans'"
          "$BT/apksigner" verify --print-certs "$APK" | grep -q "CN=COCPlugin"
          unzip -l "$APK" | grep -q classes.dex
          cat dist/COCPlugin-1.0.0.sha256

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: COCPlugin-1.0.0
          path: |
            dist/COCPlugin-1.0.0.apk
            dist/COCPlugin-1.0.0.sha256
          if-no-files-found: error
